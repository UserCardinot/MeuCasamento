# Convites multi-evento (o app escolhe o evento pelo Host).
# Instalar: cp para /etc/nginx/sites-available/eventos-convite e ln -s em sites-enabled.
# HTTPS: certbot --nginx -d convite-henry.lumenemotion.com.br -d convite-ediane.lumenemotion.com.br
server {
    listen 80;
    server_name convite-henry.lumenemotion.com.br convite-ediane.lumenemotion.com.br;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
