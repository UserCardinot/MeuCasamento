<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <defs>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.5" fill="#5a6344" opacity="0.35" />
      <circle cx="14" cy="12" r="0.42" fill="#5a6344" opacity="0.28" />
      <circle cx="9" cy="17" r="0.38" fill="#5a6344" opacity="0.25" />
    </pattern>
    <radialGradient id="valley" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a5038" stop-opacity="0.14" />
      <stop offset="72%" stop-color="#4a5038" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#4a5038" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="peak" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#fffdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fffdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Papel amassado: vales e relevos (grande escala) -->
  <ellipse cx="88" cy="108" rx="98" ry="68" fill="url(#valley)" />
  <ellipse cx="248" cy="208" rx="86" ry="58" fill="url(#valley)" opacity="0.85" />
  <ellipse cx="200" cy="48" rx="72" ry="50" fill="url(#valley)" opacity="0.7" />
  <ellipse cx="36" cy="248" rx="80" ry="54" fill="url(#valley)" opacity="0.75" />

  <ellipse cx="220" cy="92" rx="76" ry="52" fill="url(#peak)" />
  <ellipse cx="52" cy="168" rx="84" ry="58" fill="url(#peak)" opacity="0.9" />
  <ellipse cx="168" cy="268" rx="70" ry="46" fill="url(#peak)" opacity="0.8" />

  <!-- Vincos suaves (não retos) -->
  <g stroke="#5a6344" stroke-linecap="round" fill="none" opacity="0.075">
    <path stroke-width="1.1" d="M24 36 Q120 128 48 268" />
    <path stroke-width="0.85" d="M288 28 Q180 140 272 252" opacity="0.85" />
    <path stroke-width="0.75" d="M8 168 Q160 108 312 188" opacity="0.7" />
  </g>

  <rect width="100%" height="100%" fill="url(#grain)" opacity="0.45" />

  <!-- Fibras horizontais onduladas (mantidas) -->
  <g stroke="#5a6344" stroke-linecap="round" opacity="0.16">
    <path stroke-width="0.5" d="M0 52 Q80 48 160 54 T320 50" />
    <path stroke-width="0.45" d="M0 122 Q120 126 240 120 T320 123" opacity="0.9" />
    <path stroke-width="0.48" d="M0 192 Q100 188 200 194 T320 191" />
    <path stroke-width="0.46" d="M0 262 Q140 266 280 260 T320 263" opacity="0.85" />
  </g>
</svg>
